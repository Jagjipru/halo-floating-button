name: Build Play AAB

# Run this manually from the Actions tab when you want a Play-ready file.
# Signs the AAB with the same stable key used for the sideload APK, so it is
# a valid, consistent upload key for Google Play App Signing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: halo-signing-v2

      - name: Ensure signing key exists
        env:
          KS_PW: ${{ github.repository_id }}
        run: |
          if [ ! -f .signing/debug.jks ]; then
            mkdir -p .signing
            keytool -genkeypair -v -keystore .signing/debug.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias halo \
              -storepass "$KS_PW" -keypass "$KS_PW" -dname "CN=Halo Personal"
          fi

      - name: Build signed release AAB
        env:
          KS_PW: ${{ github.repository_id }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Name the AAB with its version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/bundle/release/app-release.aab "Halo-v$VER.aab"
          echo "Built Halo-v$VER.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-play-aab
          path: Halo-v*.aab
          if-no-files-found: error
