name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Persist one signing key across builds so every APK is signed with the
      # same key and installs over the previous one (no uninstall needed).
      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: halo-signing-v2

      - name: Ensure signing key exists
        env:
          KS_PW: ${{ github.repository_id }}
        run: |
          if [ ! -f .signing/debug.jks ]; then
            mkdir -p .signing
            keytool -genkeypair -v -keystore .signing/debug.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias halo \
              -storepass "$KS_PW" -keypass "$KS_PW" -dname "CN=Halo Personal"
          fi

      - name: Build debug APK
        env:
          KS_PW: ${{ github.repository_id }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk Halo.apk
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create latest Halo.apk \
            --title "Halo v$VER" \
            --notes "version: $VER" \
            --target main
