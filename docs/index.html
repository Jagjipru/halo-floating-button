<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo: Floating Button</title>
<style>
  :root { --ink:#161A21; --muted:#5F6B7A; --accent:#F2552C; --bg:#ffffff; --card:#F4F6F9; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) { --ink:#E8ECF2; --muted:#9AA6B4; --bg:#0E1116; --card:#171C23; }
  }
  :root[data-theme="dark"]{ --ink:#E8ECF2; --muted:#9AA6B4; --bg:#0E1116; --card:#171C23; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:56px 16px; text-align:center; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:30px; margin:0 0 6px; }
  p { color:var(--muted); }
  a.btn { display:inline-block; margin-top:18px; background:var(--accent); color:#fff;
    text-decoration:none; padding:12px 20px; border-radius:12px; font-weight:600; }
  a.link { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Halo: Floating Button</h1>
  <p>A minimalist floating button for Android — quick volume, torch, screenshot,
  screen lock and app shortcuts, from anywhere.</p>
  <p><a class="link" href="privacy-policy.html">Privacy Policy</a></p>
</main>
</body>
</html>
